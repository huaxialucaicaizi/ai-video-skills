<!-- 数据卡：强调数字；数字来源须可核对，未知写「待核实」 -->
<section
  class="clip overlay-data"
  data-start="{{START}}"
  data-duration="{{DURATION}}"
  data-track-index="{{TRACK}}"
>
  <div class="card-inner">
    <p class="label">{{LABEL}}</p>
    <p class="number">{{NUMBER}}</p>
    <p class="unit">{{UNIT}}</p>
    <p class="note">{{NOTE}}</p>
  </div>
</section>
