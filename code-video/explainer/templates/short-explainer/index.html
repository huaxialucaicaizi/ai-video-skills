<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>short-explainer · 虚构示例</title>
    <!-- GSAP: npm local file only — do not use jsDelivr / CDN -->
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Noto Sans SC";
        src: url("./fonts/NotoSansSC-Regular.woff") format("woff");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Noto Sans SC";
        src: url("./fonts/NotoSansSC-Bold.woff") format("woff");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }

      :root {
        --bg: #0f1c24;
        --text: #f5f7fa;
        --accent: #2f6fed;
        --secondary: #e8eef2;
        --safe-x: 80px;
        --safe-y: 160px;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: "Noto Sans SC", sans-serif;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .safe {
        position: absolute;
        left: var(--safe-x);
        right: var(--safe-x);
        top: var(--safe-y);
        bottom: calc(var(--safe-y) + 140px);
      }
      .eyebrow {
        font-size: 32px;
        letter-spacing: 0.08em;
        color: var(--accent);
        margin: 0 0 28px;
        font-weight: 700;
      }
      h1 {
        font-size: 72px;
        line-height: 1.2;
        margin: 0 0 28px;
        font-weight: 700;
      }
      h2 {
        font-size: 56px;
        line-height: 1.25;
        margin: 0 0 24px;
        font-weight: 700;
      }
      .body {
        font-size: 36px;
        line-height: 1.45;
        margin: 0;
        max-width: 860px;
      }
      .subtitle {
        position: absolute;
        left: var(--safe-x);
        right: var(--safe-x);
        bottom: var(--safe-y);
        font-size: 48px;
        line-height: 1.35;
        font-weight: 700;
        margin: 0;
        text-align: left;
      }
      .card {
        background: rgba(232, 238, 242, 0.08);
        border-left: 6px solid var(--accent);
        padding: 28px 32px;
        margin-top: 36px;
        border-radius: 0;
      }
      .card p {
        font-size: 34px;
        margin: 0;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="9"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <!-- Shot 1: 0–3s title -->
      <section class="clip" id="shot1" data-start="0" data-duration="3" data-track-index="1">
        <div class="safe">
          <p class="eyebrow" id="s1-eye">VIBE 科普</p>
          <h1 id="s1-title">什么是 token？</h1>
          <p class="body" id="s1-body">用一分钟搞懂大模型计费里的「字数单位」。</p>
        </div>
        <p class="subtitle" id="s1-sub">token：模型读写文本的基本单位</p>
      </section>

      <!-- Shot 2: 3–6s definition -->
      <section class="clip" id="shot2" data-start="3" data-duration="3" data-track-index="1">
        <div class="safe">
          <h2 id="s2-title">它大概是什么？</h2>
          <p class="body" id="s2-body">模型把文字切成小块来计算——费用和长度上限，往往按 token 计。</p>
          <div class="card" id="s2-card">
            <p>具体分词规则以各厂商文档为准（本片为虚构科普示例）。</p>
          </div>
        </div>
        <p class="subtitle" id="s2-sub">计费与长度，常按 token 估算</p>
      </section>

      <!-- Shot 3: 6–9s caveat -->
      <section class="clip" id="shot3" data-start="6" data-duration="3" data-track-index="1">
        <div class="safe">
          <h2 id="s3-title">注意一点</h2>
          <p class="body" id="s3-body">同样一句中文，不同模型切出来的 token 数可能不一样。</p>
          <div class="card" id="s3-card">
            <p>对比数字前，先查当前模型的官方说明。</p>
          </div>
        </div>
        <p class="subtitle" id="s3-sub">分词因模型而异，数字待核实</p>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Shot 1 enter (overshoot)
      tl.fromTo(
        "#s1-eye",
        { opacity: 0, y: 36 },
        { opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.6)" },
        0.15,
      );
      tl.fromTo(
        "#s1-title",
        { opacity: 0, y: 48 },
        { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" },
        0.28,
      );
      tl.fromTo(
        "#s1-body",
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.45,
      );
      tl.fromTo(
        "#s1-sub",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.55,
      );

      // Shot 2
      tl.fromTo(
        "#s2-title",
        { opacity: 0, y: 48 },
        { opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.4)" },
        3.1,
      );
      tl.fromTo(
        "#s2-body",
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        3.25,
      );
      tl.fromTo(
        "#s2-card",
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        3.4,
      );
      tl.fromTo(
        "#s2-sub",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        3.45,
      );

      // Shot 3
      tl.fromTo(
        "#s3-title",
        { opacity: 0, y: 48 },
        { opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.4)" },
        6.1,
      );
      tl.fromTo(
        "#s3-body",
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        6.25,
      );
      tl.fromTo(
        "#s3-card",
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        6.4,
      );
      tl.fromTo(
        "#s3-sub",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        6.45,
      );

      window.__timelines.main = tl;
    </script>
  </body>
</html>
