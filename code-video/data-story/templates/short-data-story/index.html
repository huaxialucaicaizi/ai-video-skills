<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>short-data-story · 虚构示例</title>
<script src="./node_modules/gsap/dist/gsap.min.js"></script>
<style>
@font-face { font-family:"Noto Sans SC"; src:url("./fonts/NotoSansSC-Regular.woff") format("woff"); font-weight:400; font-style:normal; font-display:block; }
@font-face { font-family:"Noto Sans SC"; src:url("./fonts/NotoSansSC-Bold.woff") format("woff"); font-weight:700; font-style:normal; font-display:block; }
:root { --bg:#0f1c24; --text:#f5f7fa; --accent:#2f6fed; --muted:#9aa7b2; --safe-x:80px; --safe-y:160px; }
* { box-sizing:border-box; }
body { margin:0; background:#000; }
#root { position:relative; width:1080px; height:1920px; overflow:hidden; background:var(--bg); color:var(--text); font-family:"Noto Sans SC",sans-serif; }
.clip { position:absolute; inset:0; }
.safe { position:absolute; left:var(--safe-x); right:var(--safe-x); top:var(--safe-y); bottom:calc(var(--safe-y) + 160px); display:flex; flex-direction:column; justify-content:center; gap:36px; }
.eyebrow { font-size:32px; letter-spacing:.08em; color:var(--accent); margin:0; font-weight:700; }
h1 { font-size:68px; line-height:1.15; margin:0; font-weight:700; }
h2 { font-size:56px; margin:0; font-weight:700; }
.body { font-size:36px; line-height:1.45; margin:0; color:var(--secondary,#e8eef2); }
.card { background:rgba(255,255,255,.06); border-left:6px solid var(--accent); padding:28px 32px; border-radius:4px; font-size:34px; line-height:1.4; }
.subtitle { position:absolute; left:var(--safe-x); right:var(--safe-x); bottom:120px; font-size:48px; line-height:1.35; margin:0; text-align:center; }
.badge { display:inline-block; background:#c45c26; color:#fff; font-size:28px; font-weight:700; padding:10px 18px; border-radius:4px; }
.bar { height:28px; background:rgba(255,255,255,.12); border-radius:6px; overflow:hidden; }
.bar > i { display:block; height:100%; background:var(--accent); width:0%; }
.row { display:flex; align-items:center; gap:20px; font-size:34px; }
.quote { font-size:64px; font-weight:700; line-height:1.25; margin:0; }
.placeholder { border:3px dashed rgba(255,255,255,.35); min-height:420px; display:flex; align-items:center; justify-content:center; font-size:40px; color:var(--muted); }
.shape { position:absolute; border-radius:16px; background:var(--accent); }

.chart { display:flex; align-items:flex-end; gap:36px; height:520px; padding-top:24px; }
.col { flex:1; display:flex; flex-direction:column; align-items:center; gap:16px; }
.col .v { font-size:32px; font-weight:700; }
.col .barwrap { width:100%; height:420px; display:flex; align-items:flex-end; }
.col .barfill { width:100%; background:var(--accent); border-radius:10px 10px 0 0; height:0%; }
.col .lab { font-size:30px; color:#c9d3db; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1080" data-height="1920" data-fps="30">
  <section class="clip" id="shot1" data-start="0" data-duration="3" data-track-index="1">
    <div class="safe">
      <span class="badge" id="b1">示例数据</span>
      <p class="eyebrow" id="e1">DATA STORY</p>
      <h1 id="t1">三周活跃怎么变？</h1>
      <p class="body" id="d1">用虚构 CSV 演示柱状升起；正式片请换成你的真实表格。</p>
    </div>
    <p class="subtitle" id="s1">结论先说清，再动起来</p>
  </section>
  <section class="clip" id="shot2" data-start="3" data-duration="4" data-track-index="1">
    <div class="safe">
      <span class="badge" id="b2">示例数据</span>
      <h2 id="t2">活跃用户（人）</h2>
      <div class="chart" id="chart">
        <div class="col"><div class="v" id="v1">120</div><div class="barwrap"><div class="barfill" id="bar1"></div></div><div class="lab">第1周</div></div>
        <div class="col"><div class="v" id="v2">180</div><div class="barwrap"><div class="barfill" id="bar2"></div></div><div class="lab">第2周</div></div>
        <div class="col"><div class="v" id="v3">240</div><div class="barwrap"><div class="barfill" id="bar3"></div></div><div class="lab">第3周</div></div>
      </div>
    </div>
    <p class="subtitle" id="s2">第3周约为第1周的 2 倍</p>
  </section>
  <section class="clip" id="shot3" data-start="7" data-duration="2" data-track-index="1">
    <div class="safe">
      <span class="badge" id="b3">示例数据</span>
      <h2 id="t3">一句话带走</h2>
      <div class="card" id="c3"><p>趋势向上时，先核对口径，再对外讲故事。</p></div>
    </div>
    <p class="subtitle" id="s3">示例数据，勿当作真实业务</p>
  </section>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.from("#b1,#e1,#t1,#d1,#s1", { opacity:0, y:30, stagger:0.08, duration:0.5, ease:"power3.out" }, 0.15);
tl.from("#b2,#t2", { opacity:0, y:28, duration:0.45, stagger:0.08, ease:"power3.out" }, 3.1);
tl.to("#bar1", { height:"50%", duration:0.7, ease:"power3.out" }, 3.3);
tl.to("#bar2", { height:"75%", duration:0.7, ease:"power3.out" }, 3.45);
tl.to("#bar3", { height:"100%", duration:0.7, ease:"power3.out" }, 3.6);
tl.from("#s2", { opacity:0, y:20, duration:0.4 }, 3.8);
tl.from("#b3,#t3,#c3,#s3", { opacity:0, y:28, stagger:0.08, duration:0.45, ease:"power3.out" }, 7.1);
window.__timelines.main = tl;
</script>
</body></html>
