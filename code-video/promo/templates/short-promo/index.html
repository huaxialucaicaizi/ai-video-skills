<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<title>short-promo · 虚构示例</title><script src="./node_modules/gsap/dist/gsap.min.js"></script>
<style>
@font-face { font-family:"Noto Sans SC"; src:url("./fonts/NotoSansSC-Regular.woff") format("woff"); font-weight:400; font-style:normal; font-display:block; }
@font-face { font-family:"Noto Sans SC"; src:url("./fonts/NotoSansSC-Bold.woff") format("woff"); font-weight:700; font-style:normal; font-display:block; }
:root { --bg:#0f1c24; --text:#f5f7fa; --accent:#2f6fed; --muted:#9aa7b2; --safe-x:80px; --safe-y:160px; }
* { box-sizing:border-box; }
body { margin:0; background:#000; }
#root { position:relative; width:1080px; height:1920px; overflow:hidden; background:var(--bg); color:var(--text); font-family:"Noto Sans SC",sans-serif; }
.clip { position:absolute; inset:0; }
.safe { position:absolute; left:var(--safe-x); right:var(--safe-x); top:var(--safe-y); bottom:calc(var(--safe-y) + 160px); display:flex; flex-direction:column; justify-content:center; gap:36px; }
.eyebrow { font-size:32px; letter-spacing:.08em; color:var(--accent); margin:0; font-weight:700; }
h1 { font-size:68px; line-height:1.15; margin:0; font-weight:700; }
h2 { font-size:56px; margin:0; font-weight:700; }
.body { font-size:36px; line-height:1.45; margin:0; color:var(--secondary,#e8eef2); }
.card { background:rgba(255,255,255,.06); border-left:6px solid var(--accent); padding:28px 32px; border-radius:4px; font-size:34px; line-height:1.4; }
.subtitle { position:absolute; left:var(--safe-x); right:var(--safe-x); bottom:120px; font-size:48px; line-height:1.35; margin:0; text-align:center; }
.badge { display:inline-block; background:#c45c26; color:#fff; font-size:28px; font-weight:700; padding:10px 18px; border-radius:4px; }
.bar { height:28px; background:rgba(255,255,255,.12); border-radius:6px; overflow:hidden; }
.bar > i { display:block; height:100%; background:var(--accent); width:0%; }
.row { display:flex; align-items:center; gap:20px; font-size:34px; }
.quote { font-size:64px; font-weight:700; line-height:1.25; margin:0; }
.placeholder { border:3px dashed rgba(255,255,255,.35); min-height:420px; display:flex; align-items:center; justify-content:center; font-size:40px; color:var(--muted); }
.shape { position:absolute; border-radius:16px; background:var(--accent); }
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1080" data-height="1920" data-fps="30">
<section class="clip" data-start="0" data-duration="3" data-track-index="1">
  <div class="safe"><span class="badge" id="a">示例</span><p class="eyebrow" id="b">PRODUCT PROMO</p><h1 id="c">把重复工作交给流程</h1><p class="body" id="d">虚构示例工具，仅作模板演示。</p></div>
  <p class="subtitle" id="e">真实界面请换成你的截图</p>
</section>
<section class="clip" data-start="3" data-duration="3" data-track-index="1">
  <div class="safe"><span class="badge" id="f">示例</span><div class="placeholder" id="g">界面占位 · 示例</div><div class="card" id="h"><p>1 导入　2 自动整理　3 一键导出</p></div></div>
  <p class="subtitle" id="i">三步上手</p>
</section>
<section class="clip" data-start="6" data-duration="3" data-track-index="1">
  <div class="safe"><h2 id="j">现在就开始</h2><p class="body" id="k">把占位换成你的产品录屏，再对外发布。</p></div>
  <p class="subtitle" id="l">无真实品牌素材</p>
</section>
</div>
<script>window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true});
tl.from("#a,#b,#c,#d,#e",{opacity:0,y:28,stagger:.07,duration:.5},0.2);
tl.from("#f,#g,#h,#i",{opacity:0,y:28,stagger:.08,duration:.5},3.15);
tl.from("#j,#k,#l",{opacity:0,y:28,stagger:.08,duration:.5},6.15);
window.__timelines.main=tl;</script></body></html>
