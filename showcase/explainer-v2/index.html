<script>
  L.installFilters();
  document.querySelectorAll("[data-robot]").forEach(function (el) { el.innerHTML = L.robot("", el.getAttribute("data-robot") || ""); });
  document.querySelectorAll(".robot").forEach(function (s) { s.style.width = "100%"; s.style.height = "auto"; s.style.display = "block"; });

  // S4 geometry: ring + three arrowheads, computed once.
  (function () {
    var cx = 540, cy = 1000, R = 330;
    var pt = function (a, r) { r = r || R; a = a * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
    var d = "", i, p;
    for (i = 0; i <= 72; i++) { p = pt(-90 + i * 5, R + Math.sin(i * 0.7) * 4); d += (i ? " L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }
    document.getElementById("s4c").setAttribute("d", d);
    [-30, 90, 210].forEach(function (a, k) {
      var tip = pt(a + 4), b1 = pt(a - 6, R - 26), b2 = pt(a - 6, R + 26);
      document.getElementById("s4a" + (k + 1)).setAttribute("d", "M" + b1.join(" ") + " L" + tip.join(" ") + " L" + b2.join(" "));
    });
    window.__ringPt = pt;
  })();

  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });
  var SPB = 0.5; // 120 BPM
  L.boil(tl, 30, 0.1);

  // ---------- S1 (0–4) ----------
  K.rise(tl, "#s1e", 0.0, { y: 20, d: 0.4 });
  L.drawAll(tl, "#s1u", 0.3, 0.4);
  L.drawAll(tl, "#s1b", 0.1, 0.8);
  K.riseChars(tl, "#s1a", 0.5, { stagger: 0.06 });
  L.slam(tl, "#s1c", 2.0, 1.7);
  L.drawAll(tl, "#s1s", 2.1, 0.25, 0.06);
  K.mark(tl, "#s1m", 2.5);
  tl.fromTo("#s1r", { autoAlpha: 0, y: 80 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "expo.out" }, 2.5);
  L.drawAll(tl, "#s1r", 2.5, 0.4, 0.02);
  tl.fromTo("#s1r .r-arm-r", { rotation: 0, svgOrigin: "200 230" }, { rotation: -60, duration: SPB / 2, ease: "sine.inOut", yoyo: true, repeat: 3 }, 3.0);
  K.rise(tl, "#s1t", 3.0, { y: 24, d: 0.4 });
  tl.fromTo("#wipe", { xPercent: -120 }, { xPercent: 0, duration: 0.42, ease: "power3.in" }, 3.58);
  tl.to("#wipe", { xPercent: 120, duration: 0.45, ease: "power3.out" }, 4.0);

  // ---------- S2 (4–8) ----------
  K.rise(tl, "#s2k", 4.1, { y: 16, d: 0.3 });
  L.drawAll(tl, "#s2bb", 4.1, 0.4);
  K.riseChars(tl, "#s2q", 4.2, { stagger: 0.025, d: 0.4 });
  L.drawAll(tl, "#s2d", 4.4, 0.5);
  tl.fromTo("#s2L", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "expo.out" }, 4.5);
  L.drawAll(tl, "#s2L", 4.5, 0.5, 0.03);
  tl.fromTo("#s2R", { autoAlpha: 0, x: 40 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "expo.out" }, 6.0);
  L.drawAll(tl, "#s2R", 6.0, 0.5, 0.02);
  L.dots(tl, "#s2R", 6.2);
  tl.to("#s2L", { opacity: 0.35, duration: 0.4 }, 6.5);
  L.bob(tl, "#s2r", 6.5, 7.5, SPB, 10);
  tl.to("#s2", { scale: 1.25, transformOrigin: "811px 1050px", duration: 0.5, ease: "power2.in" }, 7.5);

  // ---------- S3 (8–12) ----------
